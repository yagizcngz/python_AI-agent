[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-ai-agent"
version = "0.2.0"
description = "Autonomous Python AI Agent with sandboxed tools, ReAct reasoning, and Textual TUI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Yağız Cengiz", email = "yagizcengiz55@gmail.com" }
]
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "textual>=0.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ai-agent = "ai_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
